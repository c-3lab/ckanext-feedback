{% set feedback_fields = h.get_feedback_fields(res) %}

{% if feedback_fields %}
  <tr class="feedback-section-header">
    <th scope="row" colspan="2">
      {{ _('Feedback') }}
    </th>
  </tr>

  {% for label, value in feedback_fields.items() %}
    <tr class="feedback-field">
      <th scope="row">
        {{ label }}
      </th>
      <td>
        {{ value }}
      </td>
    </tr>
  {% endfor %}
{% endif %}
